<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#D4AF37"
        stroke-opacity="0.08"
        stroke-width="1"
      />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Left accent line -->
  <rect
    x="0"
    y="0"
    width="6"
    height="300"
    fill="#D4AF37"
  />

  <!-- Main name -->
  <text
    x="70"
    y="140"
    font-family="'Fira Code', monospace"
    font-size="52"
    font-weight="700"
    fill="#D4AF37"
  >
    HARSITH GOVIND
  </text>

  <!-- Subtitle -->
  <text
    x="72"
    y="180"
    font-family="'Fira Code', monospace"
    font-size="20"
    fill="#c9d1d9"
  >
    AI &amp; Data Science  ·  Full-Stack AI Engineer (in progress)  ·  🇩🇪 Germany-bound
  </text>

  <!-- Terminal box -->
  <rect
    x="820"
    y="45"
    width="320"
    height="90"
    rx="8"
    fill="#0d1117"
    stroke="#D4AF37"
    stroke-opacity="0.5"
    stroke-width="1.5"
  />

  <!-- Terminal buttons -->
  <circle
    cx="842"
    cy="65"
    r="5"
    fill="#D4AF37"
    fill-opacity="0.6"
  />

  <circle
    cx="860"
    cy="65"
    r="5"
    fill="#D4AF37"
    fill-opacity="0.35"
  />

  <circle
    cx="878"
    cy="65"
    r="5"
    fill="#D4AF37"
    fill-opacity="0.2"
  />

  <!-- Terminal text -->
  <text
    x="842"
    y="100"
    font-family="'Fira Code', monospace"
    font-size="16"
    fill="#D4AF37"
  >
    &gt; still grinding
  </text>

  <!-- Blinking terminal cursor -->
  <rect
    x="980"
    y="88"
    width="10"
    height="18"
    fill="#D4AF37"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Bottom scan line -->
  <rect
    x="0"
    y="296"
    width="1200"
    height="4"
    fill="#D4AF37"
    fill-opacity="0.3"
  >
    <animate
      attributeName="fill-opacity"
      values="0.15;0.5;0.15"
      dur="2.5s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
